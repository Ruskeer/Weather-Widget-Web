<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Web</title>
    <link href="weather.css" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type ="text" placeholder="Enter city name..."
            spellcheck="false"/>
            <button><img src="searchh.png"></button>
        </div>
        <div class="error">
            <p>Invalid City Name.</p>
        </div>
        <div class="weather">
            
            <img class="weather-icon" src="rain.png"/>
            <p class="des"></p>
            <h1 class="temp">22°</h1>
            <h2 class="city">Manila</h2>

            <div class="details">
                <div class="col">

                    <img src="humidity.png"/>
                    <div>
                        <div class="humidity">50%</div>
                        <p>Humidity</p>
                    </div>    
                </div>

                <div class="col">

                    <img src="wind.png"/>
                    <div>
                        <div class="wind">15 km/h</div>
                        <p>Wind Speed</p>
                    </div>    
                </div>

            </div>
        
        </div>
    </div>
    <script>
        const apikey = "ef31635b5330c955e6fd6ae7c241ba7c";
        const apiurl = "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";
        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const icon = document.querySelector(".weather-icon");

        async function checkWeather(city) {
            const response = await fetch(apiurl + city + `&appid=${apikey}`);
            var data = await response.json();

            if(response.status == 404) {
                document.querySelector(".error").classList.add("show");
                document.querySelector(".weather").classList.remove("show")
            }else {
            document.querySelector(".error").classList.remove("show");
            }
            

            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°c";
            document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
            document.querySelector(".wind").innerHTML = data.wind.speed + " km/hr";
            
            


            if (data.weather[0].main == "Clouds") {
                icon.src = "cloudy.png";
                document.body.style.backgroundImage = "url('cloudy_back.gif')";
                document.querySelector(".card").style.background = "transparent";
                document.querySelector(".weather .des").innerHTML = "Cloudy"
            }

            else if (data.weather[0].main == "Rain") {
                icon.src = "rain.png";
                document.body.style.backgroundImage = "url('rainy_back.gif')";
                document.querySelector(".card").style.background = "transparent";
                document.querySelector(".weather .des").innerHTML = "Rainy"
            }
            else if (data.weather[0].main == "Clear") {
                icon.src = "sunny.png";
                document.body.style.backgroundImage = "url('sunny_back.gif')";
                document.querySelector(".card").style.background = "transparent";
                document.querySelector(".weather .des").innerHTML = "Sunny"
            }

            else if (data.weather[0].main == "Drizzle") {
                icon.src = "drizzle.png";
                document.body.style.backgroundImage = "url('drizzle.gif')";
                document.querySelector(".card").style.background = "transparent";
                document.querySelector(".weather .des").innerHTML = "Drizzle"
            }

            else if (data.weather[0].main == "Mist") {
                icon.src = "mist.png";
                document.body.style.backgroundImage = "url('mist.gif')";
                document.querySelector(".card").style.background = "transparent";
                document.querySelector(".weather .des").innerHTML = "Misty"
            }

            document.querySelector(".weather").classList.add("show");

        }

        searchBtn.addEventListener("click", () => {
            checkWeather(searchBox.value);
        })

    </script>

</body>
</html>
